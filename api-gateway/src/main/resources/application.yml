# ==========================================
# API Gateway 설정 파일
# 작성자: 30년차 백엔드 팀장
# 용도: MSA의 단일 진입점 (모든 요청이 여기로 온다)
# ==========================================

server:
  port: 8080  # Gateway 포트 (클라이언트가 접속하는 포트)

spring:
  application:
    name: api-gateway  # Eureka에 등록될 서비스명
    
  # ==========================================
  # Spring Cloud Gateway 라우팅 설정
  # ==========================================
  cloud:
    gateway:
      # CORS 설정 (Cross-Origin Resource Sharing)
      globalcors:
        cors-configurations:
          '[/**]':  # 모든 경로에 대해
            allowedOriginPatterns: 
              - "http://localhost:*"      # 로컬 개발용
              - "https://*.yourdomain.com" # 운영 도메인
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600  # preflight 캐시 시간 (1시간)
      
      # ==========================================
      # 라우팅 규칙 정의
      # ==========================================
      routes:
        # 1. 인증 서비스 라우팅 (JWT 검증 불필요)
        - id: auth-service
          uri: lb://auth-service  # lb = Load Balancer (Eureka를 통한 로드밸런싱)
          predicates:
            - Path=/auth/**       # /auth/로 시작하는 모든 요청
          filters:
            - StripPrefix=1       # /auth 제거 후 전달 (예: /auth/login → /login)
        
        # 2. 사용자 서비스 라우팅 (JWT 검증 필요)
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**  # /api/users/로 시작하는 요청
          filters:
            - StripPrefix=2       # /api/users 제거 후 전달
            - name: JwtAuthenticationFilter  # 커스텀 JWT 필터 적용
        
        # 3. 핵심 비즈니스 서비스 라우팅 (JWT 검증 필요)
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/core/**   # /api/core/로 시작하는 요청
          filters:
            - StripPrefix=2       # /api/core 제거 후 전달
            - name: JwtAuthenticationFilter  # 커스텀 JWT 필터 적용
        
        # 4. 모든 API 요청 (기본 라우팅)
        - id: fallback-service
          uri: lb://core-service  # 기본적으로 core-service로 라우팅
          predicates:
            - Path=/api/**        # /api/로 시작하는 나머지 요청
          filters:
            - StripPrefix=1       # /api 제거 후 전달
            - name: JwtAuthenticationFilter  # JWT 검증 필수

# ==========================================
# Eureka 클라이언트 설정
# ==========================================
eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/  # Eureka Server 주소
    register-with-eureka: true   # 자신을 Eureka에 등록
    fetch-registry: true         # 다른 서비스 목록 조회
    
  instance:
    prefer-ip-address: true      # IP 주소 사용 (Docker 환경 대응)
    lease-renewal-interval-in-seconds: 30      # 하트비트 전송 주기
    lease-expiration-duration-in-seconds: 90   # 만료 시간

# ==========================================
# JWT 설정
# ==========================================
jwt:
  # 주의: 실제 운영환경에서는 환경변수로 관리!
  secret: mySecretKey123456789012345678901234567890  # 256비트 이상
  expiration: 1800000  # 30분 (밀리초)

# ==========================================
# 모니터링 설정
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway  # gateway 엔드포인트 추가
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true  # /actuator/gateway 활성화

# ==========================================
# 로깅 설정
# ==========================================
logging:
  level:
    org.springframework.cloud.gateway: DEBUG  # Gateway 라우팅 로그
    org.springframework.security: INFO        # Security 로그
    com.msa.gateway: DEBUG                   # 우리 코드 로그
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

# ==========================================
# 실무 체크포인트
# ==========================================
# 
# ✅ JWT Secret은 환경변수로 관리 (${JWT_SECRET})
# ✅ CORS 도메인은 실제 도메인으로 변경
# ✅ 운영환경에서는 HTTPS 필수
# ✅ Rate Limiting 추가 고려
# ✅ Circuit Breaker 패턴 적용
# ✅ Distributed Tracing (Sleuth + Zipkin)
# 
# ==========================================